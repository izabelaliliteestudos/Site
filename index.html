<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precificação Exclusiva | Atelier</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #FAF9F6; --text-color: #2C2C2C; --accent-color: #D4AF37; --border-color: #EAEAEA; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 3rem 0; }
        .container { background: #FFFFFF; padding: 3.5rem; border-radius: 2px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.02); max-width: 550px; width: 90%; text-align: center; border: 1px solid var(--border-color); }
        h1 { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 2.2rem; margin-bottom: 0.5rem; }
        p.subtitle { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: #8A8A8A; margin-bottom: 3rem; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; text-align: left; margin-bottom: 2rem; }
        .input-group { display: flex; flex-direction: column; }
        .input-group.full-width { grid-column: span 2; }
        label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 0.6rem; color: #555555; font-weight: 500; }
        input { width: 100%; padding: 1rem; border: 1px solid var(--border-color); font-family: 'Montserrat', sans-serif; font-size: 0.95rem; box-sizing: border-box; background-color: #FCFCFC; transition: all 0.3s ease; }
        input:focus { outline: none; border-color: var(--accent-color); background-color: #FFFFFF; }
        .btn-primary { width: 100%; padding: 1.3rem; background-color: var(--text-color); color: #FFFFFF; border: none; text-transform: uppercase; letter-spacing: 2px; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: background-color 0.3s ease; }
        .btn-primary:hover { background-color: #000000; }
        .payment-step { display: none; margin-top: 3.5rem; padding: 2.5rem; border: 1px solid var(--accent-color); background-color: #FFFCF5; text-align: center; }
        .payment-step h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-top: 0; }
        .pix-code-box { width: 100%; padding: 0.8rem; font-family: monospace; font-size: 0.8rem; border: 1px dashed var(--accent-color); background: #FFF; color: #555; text-align: center; cursor: pointer; margin-bottom: 1rem; box-sizing: border-box; }
        .dossier-wrapper { display: none; margin-top: 3.5rem; padding-top: 3rem; border-top: 1px solid var(--border-color); text-align: left; }
        .dossier-header { text-align: center; margin-bottom: 2rem; }
        .dossier-header h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin: 0 0 0.5rem 0; }
        .dossier-header p { font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.9rem; color: var(--accent-color); margin: 0; }
        .metric-card { background: #FAFAFA; padding: 1.2rem; margin-bottom: 1rem; border-left: 2px solid var(--text-color); display: flex; justify-content: space-between; }
        .metric-card.accent { border-left-color: var(--accent-color); background: #FFFDF9; }
        .metric-label { font-size: 0.8rem; text-transform: uppercase; color: #666; }
        .metric-value { font-size: 1.05rem; font-weight: 500; }
        .final-price-box { text-align: center; background: var(--text-color); color: #FFFFFF; padding: 2.5rem 1rem; margin: 2rem 0; }
        .final-price-box .title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 3px; color: #CCC; margin-bottom: 0.5rem; }
        .final-price-box .value { font-size: 2.4rem; font-weight: 300; color: var(--accent-color); }
        .btn-secondary { width: 100%; padding: 1rem; background-color: transparent; color: var(--text-color); border: 1px solid var(--text-color); text-transform: uppercase; font-size: 0.8rem; cursor: pointer; }
        .btn-secondary:hover { background-color: var(--text-color); color: #FFFFFF; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Consultoria de Valor</h1>
        <p class="subtitle">A precificação como obra de arte</p>

        <div class="form-grid">
            <div class="input-group full-width">
                <label>Insumos e Materiais (R$)</label>
                <input type="number" id="materiais" value="50.00" step="0.01">
            </div>
            <div class="input-group">
                <label>Sua Hora (R$)</label>
                <input type="number" id="valor-hora" value="35.00" step="0.01">
            </div>
            <div class="input-group">
                <label>Tempo (Horas)</label>
                <input type="number" id="horas" value="3">
            </div>
            <div class="input-group">
                <label>Custos Fixos (R$)</label>
                <input type="number" id="extras" value="15.00" step="0.01">
            </div>
            <div class="input-group">
                <label>Lucro (%)</label>
                <input type="number" id="lucro" value="30">
            </div>
        </div>

        <button class="btn-primary" onclick="iniciarProcesso()">Gerar Dossiê de Valor</button>

        <div class="payment-step" id="payment-step"></div>

        <div class="dossier-wrapper" id="dossier-wrapper">
            <div class="dossier-header">
                <h2>Dossiê Exclusivo</h2>
                <p>A inteligência financeira por trás do feito à mão</p>
            </div>
            <div class="metric-card"><span class="metric-label">Mão de Obra</span><span class="metric-value" id="res-mao-de-obra">R$ 0,00</span></div>
            <div class="metric-card"><span class="metric-label">Custo Total</span><span class="metric-value" id="res-custo-total">R$ 0,00</span></div>
            <div class="metric-card accent"><span class="metric-label">Lucro Líquido</span><span class="metric-value" style="color: #B8962E;" id="res-lucro-liquido">R$ 0,00</span></div>
            <div class="final-price-box"><div class="title">Preço Sugerido</div><div class="value" id="res-preco-venda">R$ 0,00</div></div>
        </div>
    </div>

    <script>
        const SERVIDOR_URL = 'https://cc0e8e6c-9516-4dcb-8c19-b17d214b50e9-00-2n5e3bn1waxez.picard.replit.dev';

        async function iniciarProcesso() {
            alert("PASSO 1: O botão foi clicado com sucesso. Lendo as variáveis...");

            const materiais = parseFloat(document.getElementById('materiais').value);
            const valorHora = parseFloat(document.getElementById('valor-hora').value);
            const horas = parseFloat(document.getElementById('horas').value);
            const extras = parseFloat(document.getElementById('extras').value);
            const lucro = parseFloat(document.getElementById('lucro').value);

            if(isNaN(materiais) || isNaN(valorHora) || isNaN(horas) || isNaN(extras) || isNaN(lucro)) {
                alert("ERRO: Campos vazios detectados.");
                return;
            }

            alert("PASSO 2: Dados matemáticos validados. Iniciando comunicação com o Replit...");
            
            document.getElementById('payment-step').style.display = 'block';
            document.getElementById('payment-step').innerHTML = '<h2>Conectando ao banco...</h2>';

            try {
                const resposta = await fetch(`${SERVIDOR_URL}/gerar-pix`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ materiais, valorHora, horas, extras, lucro })
                });
                
                alert("PASSO 3: O Replit respondeu à chamada! Processando a resposta...");
                const dadosServidor = await resposta.json();

                if(dadosServidor.paymentId) {
                    alert("PASSO 4: Sucesso absoluto! QR Code do Mercado Pago gerado.");
                    document.getElementById('payment-step').innerHTML = `
                        <h2>Liberação do Dossiê</h2>
                        <img src="data:image/png;base64,${dadosServidor.qrCodeBase64}" alt="QR Code Pix" style="width: 200px; border-radius: 8px; margin-bottom: 1rem;">
                        <input type="text" class="pix-code-box" value="${dadosServidor.qrCode}" readonly>
                    `;
                } else {
                    alert("ERRO: O servidor respondeu, mas não enviou o Pix. Verifique o console do Replit.");
                }
            } catch (error) {
                alert("FALHA CRÍTICA: Não foi possível alcançar o link do servidor Replit.");
                console.error(error);
            }
        }
    </script>
</body>
</html>
